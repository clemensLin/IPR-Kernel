name = "IPRKernel"

# Julia environment for the data-generation scripts in data_generation/.
# The Python side is requirements.txt.
#
#   julia --project=. -e 'using Pkg; Pkg.instantiate()'
#   julia --project=. data_generation/generate_data_tfim.jl --geometry 1d --sizes 10
#
# Commit Manifest.toml alongside this file to pin the full transitive closure;
# the [compat] bounds below record the versions the committed data was produced
# with. Generated under Julia 1.12.0.

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
ITensorMPS = "0d1a4710-d33b-49a5-8f18-73bdf49b47e2"
ITensors = "9136182c-28ba-11e9-034c-db9fb085ebd5"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[compat]
# ITensors/ITensorMPS are pinned exactly: they set the numerics (DMRG, MPO
# arithmetic, perfect sampling), so a minor bump can move the data. CairoMakie
# only affects plots and is left on a caret range.
CairoMakie = "0.15"
ITensorMPS = "=0.2.6"
ITensors = "=0.6.23"
julia = "1.12"
